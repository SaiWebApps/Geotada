# Pin the compose project name so containers/volumes resolve identically from
# any checkout (main or a .claude/worktrees/* worktree). Without this, a
# worktree-run `make db-*-up` creates a parallel project named after the
# worktree directory, and the *-reset targets silently `rm -f` nonexistent
# ondoway_* volumes (docker volume rm -f exits 0 on a missing volume).
name: ondoway

services:
  neo4j:
    image: neo4j:5
    container_name: ondoway-neo4j
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/ondoway_dev_2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_dev_2026", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j-test:
    image: neo4j:5
    container_name: ondoway-neo4j-test
    ports:
      - "7475:7474"  # HTTP browser (test)
      - "7688:7687"  # Bolt protocol (test)
    environment:
      NEO4J_AUTH: neo4j/ondoway_test_2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_test_2026", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Parallel-lane pytest graphs. Same role as neo4j-test (:7688), one per
  # concurrent worktree, so two agents running `make test-file` at once cannot
  # wipe each other's fixtures: the pytest suite full-wipes its graph per-module,
  # which turns a shared graph into phantom failures rather than a slow queue.
  # Heap is capped below the uncapped :7688 default because these run alongside
  # it plus dev, workbench and Valhalla in one 8GiB Colima VM (a third uncapped
  # Neo4j killed dockerd on 2026-07-02) — 768m/256m leaves headroom while still
  # seating a full pytest fixture corpus, which the workbench's 512m/128m would
  # not.
  neo4j-test2:
    image: neo4j:5
    container_name: ondoway-neo4j-test2
    ports:
      - "7477:7474"  # HTTP browser (lane 2)
      - "7690:7687"  # Bolt protocol (lane 2)
    environment:
      NEO4J_AUTH: neo4j/ondoway_test2_2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_test2_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_test2_2026", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j-test3:
    image: neo4j:5
    container_name: ondoway-neo4j-test3
    ports:
      - "7478:7474"  # HTTP browser (lane 3)
      - "7691:7687"  # Bolt protocol (lane 3)
    environment:
      NEO4J_AUTH: neo4j/ondoway_test3_2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_test3_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_test3_2026", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Dedicated instance for the Playwright workbench suite (make test-workbench)
  # and the manual workbench API (make api-test). NEVER shared with the pytest
  # suite: `make test`/`make test-local` full-wipe 7688 per-module, so any suite
  # asserting exact DB state on 7688 is broken by a concurrent run. The
  # workbench suite pre-wipes this instance in its seed fixture instead.
  neo4j-workbench:
    image: neo4j:5
    container_name: ondoway-neo4j-workbench
    ports:
      - "7476:7474"  # HTTP browser (workbench)
      - "7689:7687"  # Bolt protocol (workbench)
    environment:
      NEO4J_AUTH: neo4j/ondoway_workbench_2026
      NEO4J_PLUGINS: '["apoc"]'
      # Tiny corpus (~50 nodes/run): cap the JVM so a third Neo4j doesn't
      # push the Colima VM (8GiB, shared with dev+test Neo4j and Valhalla's
      # tile load) into OOM — observed 2026-07-02: dockerd died mid-gate.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_workbench_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ondoway_workbench_2026", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # M1 routing engine. Never started by the db-* targets (they are
  # service-scoped); use `make valhalla-up`. First start builds tiles from
  # any .osm.pbf in ./valhalla/custom_files (`make valhalla-build-tiles`
  # downloads the Île-de-France extract there). Tiles live in the bind
  # mount, so `docker compose down -v` cannot destroy them.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: ondoway-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
    healthcheck:
      # GET /status answers 200 + version when the service is up (documented
      # health endpoint). Best-effort: not yet validated against the image's
      # installed binaries; `make valhalla-status` is the host-side check.
      test: ["CMD-SHELL", "curl -fs http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_test_data:
  neo4j_test2_data:
  neo4j_test3_data:
  neo4j_workbench_data:
