services:
  neo4j:
    image: neo4j:5
    container_name: travlr-neo4j
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/travlr_dev_2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "travlr_dev_2026", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j_data:
