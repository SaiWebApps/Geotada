services:
  - type: web
    name: ondoway-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Narration compose is ALWAYS the real fire-once Opus composer now (the
      # 'mock' provider was removed — a customer must never be served the stitcher
      # passthrough as the narrator). It needs ANTHROPIC_API_KEY (set below); the
      # hermetic test suite stubs the client offline so `make test` never spends.
      # Gate OFF the editorial-workbench graph-CRUD routers (graph/nodes/edges/
      # schema) on the public deploy. These are an UNAUTHENTICATED create/update/
      # DETACH DELETE + data/-write + deploy surface over the live Neo4j/Aura
      # graph; app.py mounts them ONLY on an explicit truthy value (fail-closed),
      # so unset would already be OFF — but we pin "false" explicitly so the
      # intent is auditable and the render-manifest test can guard it. Without
      # this OFF, anonymous callers could mutate or wipe the production corpus.
      - key: WORKBENCH_API_ENABLED
        value: "false"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      # Aura control-plane credentials are fetched by the local test runner only
      # when a read-only cloud check needs to wake a paused instance. They are
      # never used by a destructive pytest fixture.
      - key: AURA_CLIENT_ID
        sync: false
      - key: AURA_CLIENT_SECRET
        sync: false
      - key: AURA_INSTANCE_ID
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAGIC_LINK_SECRET_KEY
        generateValue: true
      - key: MAGIC_LINK_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAGIC_LINK_FROM_EMAIL
        value: auth@ondoway.com
      - key: FRONTEND_URL
        value: https://ondoway.com
      - key: APPLE_TEAM_ID
        value: BC7F6Q48GB
      - key: CORS_ORIGINS
        value: https://ondoway.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TTS_PROVIDER
        value: openai
      # ONBOARD_PROVIDER: the beat drafter production would resolve. INERT here —
      # the onboard router mounts only under WORKBENCH_API_ENABLED, which this
      # service does not set, so nothing on Render ever calls a drafter. It is
      # pinned anyway because src/onboard/beat_draft.py's get_drafter() now fails
      # closed (an unset value used to mean the free MockBeatDrafter, which is how
      # the workbench drafted a human's beats with a fake), and because
      # tests/test_workbench_matches_the_app.py derives workbench/production
      # parity from this file: scripts/workbench.sh pins the drafter, so a value
      # here is what stops that being an unreviewed local-only divergence.
      # "anthropic" is the only real drafter; never pin a double.
      - key: ONBOARD_PROVIDER
        value: anthropic
      # OpenAI TTS has no credential of its own in this manifest unless it is
      # declared here — without it a blueprint-provisioned service 502s with
      # "TTS generation failed (openai)" on every synthesis. Set the value in
      # the Render dashboard (no-op for the already-running service).
      - key: OPENAI_API_KEY
        sync: false
      # Audio MUST NOT be written to the container filesystem on this service:
      # `plan: free` has no `disk:` block, so the filesystem is ephemeral and
      # every MP3 dies on restart — while beat.audio_url is persisted in Aura
      # (stamped ON CREATE by scripts/upload_paris.py) and the generate routes
      # short-circuit on that sticky URL, so the loss is unrecoverable and every
      # GET /api/v1/audio/files/{key} 404s forever. Durable object storage (R2)
      # is the only correct backend here; credentials are set in the dashboard.
      - key: AUDIO_STORAGE
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Premium preview is an intentional paid product path. The client factory
      # fails closed without this explicit deployment authorization.
      - key: ONDOWAY_ENABLE_PAID_LLM_CALLS
        value: "1"
      # Receipt-backed Premium routing comes from the Blueprint-managed private
      # Valhalla service below. RoutingClient adds the http:// scheme to Render's
      # private-network host:port value.
      - key: VALHALLA_URL
        fromService:
          type: pserv
          name: ondoway-valhalla
          property: hostport
      - key: GITHUB_TOKEN
        sync: false

  - type: pserv
    name: ondoway-valhalla
    runtime: image
    plan: starter
    image:
      url: ghcr.io/valhalla/valhalla-scripted:latest
    disk:
      name: valhalla-data
      mountPath: /custom_files
      sizeGB: 10
    envVars:
      - key: tile_urls
        value: "https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf https://download.bbbike.org/osm/bbbike/NewYork/NewYork.osm.pbf"
      - key: use_tiles_ignore_pbf
        value: "False"
      - key: build_tar
        value: "True"
      - key: server_threads
        value: "2"
