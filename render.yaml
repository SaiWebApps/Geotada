services:
  - type: web
    name: ondoway-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Narration composer for POST /trips/{id}/compose (Phase 4 Step 4.8):
      # 'mock' = deterministic stitcher passthrough; 'anthropic' = the real
      # fire-once Opus compose gated by the real Haiku faithfulness checker
      # (needs ANTHROPIC_API_KEY). Flip to 'anthropic' to go live.
      - key: COMPOSE_PROVIDER
        value: mock
      # Gate OFF the editorial-workbench graph-CRUD routers (graph/nodes/edges/
      # schema) on the public deploy. These are an UNAUTHENTICATED create/update/
      # DETACH DELETE surface over the live Neo4j/Aura graph; app.py mounts them
      # unless this is an explicit off value. Without it, anonymous callers can
      # mutate or wipe the production corpus. Must stay "false" in prod.
      - key: WORKBENCH_API_ENABLED
        value: "false"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAGIC_LINK_SECRET_KEY
        generateValue: true
      - key: MAGIC_LINK_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAGIC_LINK_FROM_EMAIL
        value: auth@ondoway.com
      - key: FRONTEND_URL
        value: https://ondoway.com
      - key: APPLE_TEAM_ID
        value: BC7F6Q48GB
      - key: CORS_ORIGINS
        value: https://ondoway.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TTS_PROVIDER
        value: openai
      - key: AUDIO_STORAGE
        value: local
      - key: AUDIO_STORAGE_PATH
        value: audio_store
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
