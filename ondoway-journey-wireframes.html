<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ondoway · User Journey Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f4ef; --panel:#ffffff; --ink:#1a1814; --ink-soft:#4a4641; --ink-mute:#7a756d;
    --line:#d8d3c7; --line-soft:#e9e4d8;
    --sage:#6b7a5a; --sage-soft:#e7ebdf;
    --ochre:#8a6d3b; --ochre-soft:#f1e8d3;
    --slate:#4a6b7c; --slate-soft:#dde6ec;
    --terra:#c4543a; --terra-soft:#f4e2db;
    --graphite:#5a5552; --graphite-soft:#e6e3df;
    --ok:#2f8f5b; --ok-soft:#e0efe5;
    --warn:#b9852f; --warn-soft:#f6ecd6;
    --fail:#c0432f; --fail-soft:#f6ddd6;
    --r-sm:6px; --r:10px; --r-lg:14px;
    --shadow-sm:0 1px 2px rgba(26,24,20,.05);
    --shadow:0 4px 14px rgba(26,24,20,.07), 0 1px 2px rgba(26,24,20,.04);
    --shadow-lift:0 18px 44px rgba(26,24,20,.16), 0 4px 10px rgba(26,24,20,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{background-image:radial-gradient(circle at 18% 8%,rgba(196,84,58,.04) 0%,transparent 42%),radial-gradient(circle at 84% 92%,rgba(74,107,124,.05) 0%,transparent 42%);min-height:100vh}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ── Top bar ── */
  .topbar{position:sticky;top:0;z-index:60;border-bottom:1px solid var(--line);
    background:rgba(246,244,239,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .topbar-in{max-width:1500px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:baseline;gap:13px;min-width:0}
  .brand-mark{font-family:'Fraunces',serif;font-weight:600;font-size:21px;letter-spacing:-.02em}
  .brand-mark::before{content:'';display:inline-block;width:8px;height:8px;background:var(--terra);border-radius:50%;margin-right:9px;transform:translateY(-2px)}
  .brand-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-mute);white-space:nowrap}
  .top-right{display:flex;align-items:center;gap:14px}
  .viewtoggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
  .viewtoggle button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border:none;background:transparent;color:var(--ink-mute);cursor:pointer}
  .viewtoggle button.on{background:var(--ink);color:#fff}
  .counter{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);white-space:nowrap}
  .counter b{color:var(--ink)}

  /* ── Spine ── */
  .spine-wrap{max-width:1500px;margin:0 auto;padding:16px 26px 0}
  .spine{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .spine::-webkit-scrollbar{height:5px}
  .spine::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .spine-chip{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;min-width:120px;padding:9px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
  .spine-chip:hover{border-color:var(--ink-soft);transform:translateY(-1px)}
  .spine-chip .num{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--ink-mute)}
  .spine-chip .nm{font-family:'Fraunces',serif;font-size:13.5px;font-weight:500;line-height:1.12;color:var(--ink)}
  .spine-chip.on{border-color:var(--c);box-shadow:0 0 0 3px var(--c-soft);background:linear-gradient(180deg,#fff,var(--c-soft) 260%)}
  .spine-chip.on .num{color:var(--c)}
  .spine-arrow{flex:0 0 auto;align-self:center;color:var(--line);font-size:14px}

  /* ── Sub-nav ── */
  .subnav-wrap{max-width:1500px;margin:0 auto;padding:12px 26px 0}
  .subnav{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .subnav-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);margin-right:4px}
  .sc{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:20px;background:var(--panel);cursor:pointer;font-size:11.5px;color:var(--ink-soft);transition:border-color .15s,background .15s}
  .sc:hover{border-color:var(--ink-soft)}
  .sc .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .sc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sc.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .dot.happy{background:var(--ok)} .dot.edge{background:var(--warn)} .dot.fail{background:var(--fail)}

  /* ── Main layout ── */
  .main{max-width:1500px;margin:0 auto;padding:20px 26px 70px;display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:34px;align-items:start}
  @media(max-width:980px){.main{grid-template-columns:1fr;gap:24px}}
  .stage-col{display:flex;flex-direction:column;align-items:center;gap:18px;position:sticky;top:96px}
  @media(max-width:980px){.stage-col{position:static}}

  /* ── Phone frame ── */
  .phone{width:392px;height:812px;background:#0f0d0b;border-radius:48px;padding:11px;box-shadow:var(--shadow-lift);position:relative;flex:0 0 auto}
  .phone::after{content:'';position:absolute;left:50%;top:18px;transform:translateX(-50%);width:118px;height:30px;background:#0f0d0b;border-radius:18px;z-index:8}
  .screen{width:100%;height:100%;background:var(--bg);border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden}
  .scroll::-webkit-scrollbar{width:0}

  /* iOS status bar */
  .sb{height:50px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 7px;font-size:14px;font-weight:600;color:var(--ink);position:relative;z-index:5}
  .sb.on-dark{color:#fff}
  .sb .t{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:14.5px}
  .sb .r{display:flex;align-items:center;gap:6px}
  .home-ind{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .home-ind::after{content:'';width:135px;height:5px;border-radius:3px;background:var(--ink);opacity:.85}
  .home-ind.on-dark::after{background:#fff}

  /* App bar */
  .abar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 18px 12px;position:relative}
  .abar .ttl{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .abar .ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:default}
  .abar .spacer{flex:1}
  .abar.big .ttl{font-size:27px}

  /* Generic blocks */
  .pad{padding:4px 20px 22px}
  .h-fr{font-family:'Fraunces',serif;letter-spacing:-.015em;color:var(--ink)}
  .muted{color:var(--ink-mute)}
  .soft{color:var(--ink-soft)}
  .center{text-align:center}
  .stack>*+*{margin-top:12px}

  /* Buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:13px;font-size:15px;font-weight:600;border:1.5px solid transparent;cursor:default;line-height:1}
  .btn.sm{padding:11px 14px;font-size:13.5px;border-radius:11px}
  .btn-primary{background:var(--terra);color:#fff}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-out{background:var(--panel);border-color:var(--line);color:var(--ink)}
  .btn-soft{background:var(--c-soft,#eee);color:var(--c,#333)}
  .btn-ghost{background:transparent;color:var(--ink-soft)}
  .btn .sub{font-weight:400;font-size:12px;opacity:.85}
  .btn-row{display:flex;gap:10px}
  .btn-row>.btn{width:auto;flex:1}

  /* Inputs */
  .inp{display:flex;align-items:center;gap:10px;width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:15px}
  .inp .ph{color:var(--ink-mute)}
  .inp.focus{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra-soft)}
  .lab{font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 7px;display:block}
  .field+.field{margin-top:15px}
  .or{display:flex;align-items:center;gap:12px;color:var(--ink-mute);font-size:12px;margin:16px 0}
  .or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}

  /* List rows */
  .rows{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel)}
  .row{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:none}
  .row .ri{width:34px;height:34px;border-radius:9px;background:var(--c-soft,#eee);color:var(--c,#555);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row .rt{flex:1;min-width:0}
  .row .rt .a{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.2}
  .row .rt .b{font-size:12px;color:var(--ink-mute);margin-top:2px}
  .row .rv{font-size:13px;color:var(--ink-mute);white-space:nowrap}
  .chev{color:var(--ink-mute);flex:0 0 auto}

  /* Pills / chips */
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
  .pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  .pill.ready{background:var(--ok-soft);color:var(--ok)}
  .pill.draft{background:var(--ochre-soft);color:var(--ochre)}
  .pill.prog{background:var(--terra-soft);color:var(--terra)}
  .pill.done{background:var(--graphite-soft);color:var(--graphite)}
  .pill.failp{background:var(--fail-soft);color:var(--fail)}
  .pill.gen{background:var(--slate-soft);color:var(--slate)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:22px;border:1.5px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink-soft);cursor:default}
  .chip.sel{background:var(--c,#333);color:#fff;border-color:var(--c,#333)}
  .chip.sel .x{opacity:.7}
  .chipwrap{display:flex;flex-wrap:wrap;gap:8px}

  /* Tour card */
  .tcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm)}
  .tcard .thumb{height:94px;position:relative;display:flex;align-items:flex-end;padding:10px 12px}
  .tcard .thumb .topline{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
  .tcard .body{padding:12px 14px}
  .tcard .ttl{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.15;color:var(--ink)}
  .tcard .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--ink-mute)}
  .tcard .meta span{display:inline-flex;align-items:center;gap:5px}
  .tcard .act{margin-top:12px}

  /* Thumbnails (photo placeholders) */
  .thumb.p1{background:linear-gradient(135deg,#c9a978,#9c7b4f)}
  .thumb.p2{background:linear-gradient(135deg,#7c98a6,#4a6b7c)}
  .thumb.p3{background:linear-gradient(135deg,#b98a72,#8a4f3b)}
  .thumb.p4{background:linear-gradient(135deg,#9aa57f,#6b7a5a)}
  .thumb.p5{background:linear-gradient(135deg,#b0a08f,#5a5552)}
  .thumb-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.82);background:rgba(0,0,0,.18);padding:3px 7px;border-radius:5px;backdrop-filter:blur(2px)}

  /* Banners */
  .banner{display:flex;gap:11px;padding:13px 14px;border-radius:12px;font-size:13px;line-height:1.45;align-items:flex-start}
  .banner .bi{flex:0 0 auto;margin-top:1px}
  .banner .bt b{display:block;font-weight:600;color:var(--ink);margin-bottom:2px}
  .banner.err{background:var(--fail-soft);color:var(--fail)}
  .banner.warn{background:var(--warn-soft);color:#8a5d1a}
  .banner.info{background:var(--slate-soft);color:var(--slate)}
  .banner.ok{background:var(--ok-soft);color:var(--ok)}
  .banner .bt{color:var(--ink-soft)}

  /* Sheet */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 38px 38px;box-shadow:0 -12px 40px rgba(26,24,20,.18);padding:8px 20px 26px;z-index:7;border-top:1px solid var(--line-soft)}
  .sheet .grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 14px}
  .scrim{position:absolute;inset:0;background:rgba(26,24,20,.34);z-index:6}

  /* Audio player */
  .player{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
  .player .pl-top{display:flex;align-items:center;gap:12px}
  .player .pl-art{width:46px;height:46px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff}
  .player .pl-meta{flex:1;min-width:0}
  .player .pl-meta .a{font-weight:600;font-size:14.5px;color:var(--ink);line-height:1.2}
  .player .pl-meta .b{font-size:11.5px;color:var(--ink-mute);margin-top:2px}
  .wave{display:flex;align-items:center;gap:2.5px;height:34px;margin:13px 2px 6px}
  .wave i{flex:1;background:var(--line);border-radius:2px}
  .wave i.on{background:var(--terra)}
  .scrub{height:4px;border-radius:3px;background:var(--line-soft);position:relative;margin:8px 2px}
  .scrub i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--terra)}
  .scrub i::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--terra);box-shadow:var(--shadow-sm)}
  .ptime{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-mute);margin:0 2px}
  .pctrls{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:12px;color:var(--ink)}
  .pctrls .big{width:54px;height:54px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center}

  /* segmented */
  .seg{display:flex;background:var(--line-soft);border-radius:11px;padding:3px}
  .seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-mute);cursor:default}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

  /* toggle */
  .tg{width:42px;height:25px;border-radius:14px;background:var(--line);position:relative;flex:0 0 auto}
  .tg.on{background:var(--terra)}
  .tg::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:left .15s}
  .tg.on::after{left:19px}

  /* misc */
  .note{font-size:12px;color:var(--ink-mute);line-height:1.5}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--ink-mute)} .kv .v{color:var(--ink);font-weight:600;text-align:right}
  .why{background:linear-gradient(135deg,var(--bg),var(--c-soft,#eee));border:1px solid var(--line-soft);border-radius:13px;padding:13px 15px}
  .why .wl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,#555);margin-bottom:6px;font-weight:600}
  .why p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
  .big-emoji{font-size:34px;line-height:1}
  .circle-ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .progress-ring{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 0}

  /* Stage controls */
  .controls{display:flex;align-items:center;gap:16px}
  .nav-btn{display:flex;align-items:center;gap:8px;padding:11px 18px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm)}
  .nav-btn:hover{border-color:var(--ink-soft)}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed}
  .nav-btn.prim{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stage-counter{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);min-width:64px;text-align:center}

  /* Annotation panel */
  .anno{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:sticky;top:96px}
  @media(max-width:980px){.anno{position:static}}
  .anno-head{padding:22px 26px 20px;border-bottom:1px solid var(--line-soft);position:relative}
  .anno-head::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
  .anno-eye{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
  .anno-eye .pl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--c-soft);color:var(--c);font-weight:600}
  .anno-eye .sn{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-mute);letter-spacing:.08em}
  .path-badge{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .path-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .path-badge.happy{background:var(--ok-soft);color:var(--ok)}
  .path-badge.edge{background:var(--warn-soft);color:#8a5d1a}
  .path-badge.fail{background:var(--fail-soft);color:var(--fail)}
  .anno-title{font-family:'Fraunces',serif;font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 9px}
  .anno-trigger{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0}
  .anno-trigger b{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--c);margin-right:7px}
  .anno-body{padding:20px 26px 26px}
  .anno-sec+.anno-sec{margin-top:18px}
  .anno-sec h4{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-mute);margin:0 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
  .anno-sec h4::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c)}
  .anno-sec ul{margin:0;padding:0;list-style:none}
  .anno-sec li{position:relative;padding:6px 0 6px 17px;font-size:13.5px;color:var(--ink-soft);line-height:1.48;border-bottom:1px dashed var(--line-soft)}
  .anno-sec li:last-child{border-bottom:none}
  .anno-sec li::before{content:'';position:absolute;left:3px;top:13px;width:7px;height:1px;background:var(--c)}
  .recover{margin-top:18px;background:linear-gradient(135deg,var(--bg),var(--c-soft));border:1px solid var(--line-soft);border-left:3px solid var(--c);border-radius:0 12px 12px 0;padding:14px 16px}
  .recover .rl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--c);margin-bottom:6px;font-weight:600}
  .recover p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
  .anno.fading .anno-head,.anno.fading .anno-body{opacity:.35;transition:opacity .1s}
  .anno-head,.anno-body{opacity:1;transition:opacity .22s}

  /* Storyboard grid */
  .grid-wrap{max-width:1500px;margin:0 auto;padding:8px 26px 70px;display:none}
  .grid-block{margin-top:30px}
  .grid-block:first-child{margin-top:8px}
  .grid-block-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .grid-block-h .gn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--c);font-weight:600;letter-spacing:.08em}
  .grid-block-h .gt{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:-.01em}
  .grid-row{display:flex;flex-wrap:wrap;gap:26px}
  .gcell{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;width:200px}
  .gthumb{width:392px;height:812px;transform:scale(.49);transform-origin:top left;pointer-events:none}
  .gthumb-box{width:200px;height:404px;overflow:hidden;border-radius:24px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .gcell:hover .gthumb-box{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
  .gcap{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.25}
  .gcap .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

  .foot{max-width:1500px;margin:0 auto;padding:0 26px 44px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  svg{display:block}

  /* ── Tabs / sub-bar ── */
  .tabbar{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tab{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:8px 15px;border:none;background:transparent;color:var(--ink-mute);cursor:pointer;border-radius:7px;transition:background .15s,color .15s}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff}
  .subbar{max-width:1500px;margin:0 auto;padding:14px 26px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
  /* ── Build Map ── */
  .build-wrap{max-width:1500px;margin:0 auto;padding:18px 26px 70px}
  .build-title{font-family:'Fraunces',serif;font-size:26px;font-weight:600;letter-spacing:-.02em;margin:6px 0 8px}
  .build-sub{font-size:13.5px;color:var(--ink-soft);max-width:88ch;line-height:1.55;margin:0 0 16px}
  .overall{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
  .overall-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-soft)}
  .overall-bar span{display:block;height:100%}
  .overall-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-soft);align-items:center}
  .overall-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .dash{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  @media(max-width:980px){.dash{grid-template-columns:1fr}}
  .dash-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow-sm)}
  .dash-card.crit{border-color:var(--fail);background:linear-gradient(180deg,#fff,var(--fail-soft) 460%)}
  .dc-h{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;margin-bottom:9px}
  .dash-card.crit .dc-h{color:var(--fail)}
  .dash-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin:0}
  .dash-card ol{counter-reset:seq;margin:0;padding:0;list-style:none;font-size:12px;color:var(--ink-soft);line-height:1.45}
  .dash-card ol li{counter-increment:seq;padding:4px 0 4px 24px;position:relative}
  .dash-card ol li::before{content:counter(seq);position:absolute;left:0;top:3px;width:17px;height:17px;border-radius:50%;background:var(--ochre-soft);color:var(--ochre);font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .dash-card ol li.next-sep{counter-increment:none;padding:8px 0 2px;color:var(--ink-mute);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  .dash-card ol li.next-sep::before{display:none}
  .dash-card ul{margin:0;padding:0;list-style:none;font-size:12px;color:var(--ink-soft);line-height:1.45}
  .dash-card ul li{padding:5px 0 5px 13px;position:relative;border-bottom:1px dashed var(--line-soft)}
  .dash-card ul li:last-child{border-bottom:none}
  .dash-card ul li::before{content:'';position:absolute;left:2px;top:12px;width:6px;height:1px;background:var(--ink-mute)}
  .dash-card ul li b{color:var(--ink)}
  .heat-block{margin-bottom:26px}
  .heat-bh{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .heat-bh .gn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);font-weight:600}
  .heat-bh .gt{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
  .heat-prog{flex:1;max-width:200px;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
  .heat-prog span{display:block;height:100%;background:var(--ok)}
  .heat-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);min-width:34px;text-align:right}
  .heat-row{display:flex;flex-wrap:wrap;gap:24px}
  .hcell{width:200px;cursor:pointer}
  .hthumb-box{width:200px;height:404px;overflow:hidden;border-radius:22px;box-shadow:var(--shadow);position:relative;border-top:4px solid var(--st);transition:transform .15s,box-shadow .15s}
  .hcell:hover .hthumb-box{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
  .hthumb{width:392px;height:812px;transform:scale(.49);transform-origin:top left;pointer-events:none}
  .hbadge{position:absolute;top:9px;right:9px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;font-weight:600;z-index:2;box-shadow:var(--shadow-sm)}
  .hcap{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink);text-align:center;margin-top:8px;line-height:1.3}
  .hnote{font-size:10.5px;color:var(--ink-mute)}
  /* ── Strategy ── */
  .strat{max-width:900px;margin:0 auto;padding:24px 26px 80px}
  .strat h2{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.02em;margin:30px 0 10px;color:var(--ink)}
  .strat h2:first-of-type{margin-top:6px}
  .strat p{font-size:13.5px;color:var(--ink-soft);line-height:1.62;margin:0 0 12px}
  .verdict{background:linear-gradient(135deg,var(--bg),var(--terra-soft));border:1px solid var(--line-soft);border-left:3px solid var(--terra);border-radius:0 14px 14px 0;padding:18px 20px;margin-bottom:6px}
  .verdict .vl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:8px}
  .verdict p{font-size:14px;color:var(--ink);margin:0 0 10px;line-height:1.6}
  .verdict p:last-child{margin-bottom:0}
  .strat-table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .strat-table th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);padding:9px 11px;background:rgba(246,244,239,.7);border-bottom:1px solid var(--line)}
  .strat-table td{padding:9px 11px;border-bottom:1px dashed var(--line-soft);color:var(--ink-soft);vertical-align:top;line-height:1.4}
  .strat-table tr:last-child td{border-bottom:none}
  .strat-table td b{color:var(--ink)}
  .box{border:1px solid var(--line-soft);border-radius:12px;padding:15px 17px;margin:10px 0 14px;background:var(--panel)}
  .box.warnbox{background:var(--warn-soft);border-color:transparent}
  .box .bxl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#8a5d1a;font-weight:600;margin-bottom:7px}
  .box p{margin:0;font-size:13px;line-height:1.55}
  ul.clean{list-style:none;padding:0;margin:0 0 12px}
  ul.clean li{position:relative;padding:7px 0 7px 22px;font-size:13px;color:var(--ink-soft);line-height:1.5;border-bottom:1px dashed var(--line-soft)}
  ul.clean li:last-child{border-bottom:none}
  ul.clean li::before{content:'';position:absolute;left:3px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
  ul.clean li.no::before{background:var(--fail)}
  ul.clean li.mid::before{background:var(--warn)}
  ul.clean li b{color:var(--ink)}
  ol.risk{counter-reset:risk;list-style:none;padding:0;margin:0 0 12px}
  ol.risk li{counter-increment:risk;position:relative;padding:9px 0 9px 34px;font-size:13px;color:var(--ink-soft);line-height:1.5;border-bottom:1px dashed var(--line-soft)}
  ol.risk li:last-child{border-bottom:none}
  ol.risk li::before{content:counter(risk);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;background:var(--line-soft);color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  ol.risk li.one::before{background:var(--fail);color:#fff}
  ol.risk li b{color:var(--ink)}
  ol.recs{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--ink-soft);line-height:1.55}
  ol.recs li{padding:3px 0}
  ol.recs li b{color:var(--ink)}
  .src{font-size:11px;color:var(--ink-mute);line-height:1.6;margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}

  /* ── Plan ── */
  .plan-wrap{max-width:1500px;margin:0 auto;padding:18px 26px 70px}
  .legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin:10px 0 22px;align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .gate-box{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:20px;font-size:13px;color:var(--ink-soft)}
  .gate-box b{color:var(--ink)}
  .plan-week{margin-bottom:24px}
  .pw-h{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .pw-n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);font-weight:600;letter-spacing:.06em}
  .pw-t{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
  .pw-d{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-mute);margin-left:auto}
  .day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;box-shadow:var(--shadow-sm)}
  .day.wknd{background:linear-gradient(180deg,var(--panel),rgba(246,244,239,.55));border-style:dashed}
  .day-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .day-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-mute);letter-spacing:.03em}
  .day-theme{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
  .day-task{font-size:12.5px;color:var(--ink-soft);line-height:1.45}

  /* ── Plan: editable tracker ── */
  .plan-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-sm)}
  .prog-wrap{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
  .prog-bar{flex:1;max-width:380px;height:10px;border-radius:6px;background:var(--line-soft);overflow:hidden}
  .prog-bar>span{display:block;height:100%;background:var(--ok);transition:width .25s}
  .prog-txt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .plan-actions{display:flex;gap:8px}
  .plan-actions button,.plan-actions .imp{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink-soft);cursor:pointer}
  .plan-actions button:hover,.plan-actions .imp:hover{border-color:var(--ink-soft);color:var(--ink)}
  .pw-prog{width:84px;height:6px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-left:8px}
  .pw-prog>span{display:block;height:100%;background:var(--ok)}
  .pw-count{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-mute)}
  .day{position:relative}
  .day.st-done{opacity:.6}
  .day.st-done .day-task{text-decoration:line-through;text-decoration-color:var(--ink-mute)}
  .day.st-doing{border-color:var(--warn)}
  .day-top{display:flex;align-items:center;gap:8px;justify-content:flex-start;margin-bottom:8px}
  .day-top .day-date{margin-right:auto}
  .status-btn{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-mute);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
  .status-btn.st-doing{border-color:var(--warn);background:var(--warn)}
  .status-btn.st-done{border-color:var(--ok);background:var(--ok)}
  .status-btn svg{width:12px;height:12px;display:block}
  .day-del{position:absolute;top:7px;right:9px;border:none;background:none;color:var(--line);font-size:17px;cursor:pointer;line-height:1;padding:2px}
  .day-del:hover{color:var(--fail)}
  .day-task[contenteditable]{outline:none;border-radius:5px;padding:1px 3px}
  .day-task[contenteditable]:focus{box-shadow:0 0 0 2px var(--terra-soft);background:#fff}
  .day-note{font-size:11.5px;color:var(--ink-mute);margin-top:8px;padding:5px 3px 0;border-top:1px dashed var(--line-soft);outline:none;min-height:15px}
  .day-note:empty::before{content:attr(data-ph);color:var(--line)}
  .day-note:focus{box-shadow:0 0 0 2px var(--terra-soft);background:#fff;border-radius:5px}
  .add-task{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);border-radius:11px;color:var(--ink-mute);font-size:12.5px;font-weight:600;cursor:pointer;min-height:70px;background:transparent;transition:border-color .15s,color .15s}
  .add-task:hover{border-color:var(--ochre);color:var(--ochre)}

  /* ── Plan: owner + output ── */
  .owner-pill{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid;font-weight:600;white-space:nowrap;background:var(--panel)}
  .day-out{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line-soft);display:flex;gap:7px;align-items:baseline}
  .out-l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;flex:0 0 auto;margin-top:1px}
  .out-t{font-size:11.5px;color:var(--ink-soft);line-height:1.42;outline:none;flex:1}
  .out-t:focus{box-shadow:0 0 0 2px var(--terra-soft);background:#fff;border-radius:4px}
  .lg-h{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:600}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark">Ondoway</div>
      <div class="brand-sub">Product Brief</div>
    </div>
    <div class="tabbar">
      <button class="tab on" id="tab-journey" onclick="setTab('journey')">Journey</button>
      <button class="tab" id="tab-build" onclick="setTab('build')">Build Map</button>
      <button class="tab" id="tab-strategy" onclick="setTab('strategy')">Strategy</button>
      <button class="tab" id="tab-plan" onclick="setTab('plan')">Plan</button>
    </div>
  </div>
</header>

<div id="journeyview">
  <div class="subbar">
    <div class="counter" id="counter"></div>
    <div class="viewtoggle">
      <button id="vt-walk" class="on" onclick="setView('walk')">Walkthrough</button>
      <button id="vt-grid" onclick="setView('grid')">Storyboard</button>
    </div>
  </div>
  <div id="walkview">
  <div class="spine-wrap"><div class="spine" id="spine"></div></div>
  <div class="subnav-wrap"><div class="subnav" id="subnav"></div></div>
  <main class="main">
    <div class="stage-col">
      <div class="phone"><div class="screen" id="screen"></div></div>
      <div class="controls">
        <button class="nav-btn" id="prev" onclick="step(-1)">‹ Prev</button>
        <div class="stage-counter" id="stagecount"></div>
        <button class="nav-btn prim" id="next" onclick="step(1)">Next ›</button>
      </div>
    </div>
    <aside class="anno" id="anno"></aside>
  </main>
</div>

<div class="grid-wrap" id="gridview"></div>
</div>

<div id="buildview" style="display:none"></div>
<div id="strategyview" style="display:none"></div>
<div id="planview" style="display:none"></div>

<footer class="foot">
  <span>Ondoway · GPS-triggered audio tours · Launch city: Paris</span>
  <span id="foot-meta"></span>
</footer>

<script>
/* ════════════ UI COMPONENT HELPERS ════════════ */
const ICON = {
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  gear:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  loc:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>',
  clock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  walk:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="13" cy="4" r="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 21l2-5-2-3 1-5 3 2 3 1M11 13l-2 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l13 7-13 7z"/></svg>',
  pause:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  back15:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M11 4L7 8l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 8h6a5 5 0 11-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  skip:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M13 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 8h-6a5 5 0 105 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  text:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',

/* SVG map. kinds: plan, live, off, mini, dest */
function mapView(kind, h=240){
  const W=352;
  const water = `<path d="M-10 ${h*0.52} C ${W*0.3} ${h*0.42}, ${W*0.55} ${h*0.66}, ${W+10} ${h*0.5} L ${W+10} ${h+10} L -10 ${h+10} Z" fill="#dbe6ea"/>
    <path d="M-10 ${h*0.52} C ${W*0.3} ${h*0.42}, ${W*0.55} ${h*0.66}, ${W+10} ${h*0.5}" stroke="#bcd0d6" stroke-width="1.5" fill="none"/>`;
  let blocks='';
  const seed=[[26,34,52,40],[96,28,58,30],[170,36,46,52],[232,30,70,42],[40,150,60,46],[120,160,54,40],[210,150,64,52],[286,150,40,40],[60,90,40,30],[260,95,46,34]];
  seed.forEach((b,i)=>{ blocks+=`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="5" fill="#efece4" stroke="#e2ddd0" stroke-width="1"/>`; });
  let streets='';
  [40,118,196,274].forEach(x=>streets+=`<line x1="${x}" y1="6" x2="${x}" y2="${h-6}" stroke="#e6e1d5" stroke-width="2"/>`);
  [56,118,180].forEach(y=>streets+=`<line x1="6" y1="${y}" x2="${W-6}" y2="${y}" stroke="#e6e1d5" stroke-width="2"/>`);

  let route='', pins='', user='';
  const pin=(x,y,n,active)=>`<g><circle cx="${x}" cy="${y}" r="13" fill="${active?'#c4543a':'#fff'}" stroke="#c4543a" stroke-width="2.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" fill="${active?'#fff':'#c4543a'}">${n}</text></g>`;
  const flag=(x,y)=>`<g><circle cx="${x}" cy="${y}" r="13" fill="#1a1814"/><path d="M${x-3} ${y-5} v9 M${x-3} ${y-5} h6 v4 h-6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round"/></g>`;
  const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="17" fill="#4a6b7c" opacity=".18"/><circle cx="${x}" cy="${y}" r="7" fill="#4a6b7c" stroke="#fff" stroke-width="2.5"/>`;

  if(kind==='plan'||kind==='dest'){
    route=`<path d="M44 ${h-40} C 90 ${h-70}, 110 110, 150 96 S 230 70, 250 60 S 300 50, 312 40" stroke="#c4543a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="1 9" opacity=".55"/>
      <path d="M44 ${h-40} C 90 ${h-70}, 110 110, 150 96 S 230 70, 250 60 S 300 50, 312 40" stroke="#c4543a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    pins = flag(44,h-40)+pin(150,96,1)+pin(250,60,2)+(kind==='dest'?flag(312,40):pin(312,40,3));
  } else if(kind==='live'){
    route=`<path d="M70 ${h-30} C 110 ${h-60}, 130 120, 168 104" stroke="#c4543a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M168 104 C 210 88, 250 80, 286 56" stroke="#c4543a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="2 9" opacity=".5"/>`;
    pins = pin(168,104,2,true)+pin(286,56,3);
    user = dot(108,h-46);
  } else if(kind==='off'){
    route=`<path d="M70 ${h-30} C 110 ${h-60}, 130 120, 168 104 S 250 80, 286 56" stroke="#c4543a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="2 9" opacity=".45"/>`;
    pins = pin(168,104,2)+pin(286,56,3);
    user = `<line x1="250" y1="150" x2="168" y2="104" stroke="#c0432f" stroke-width="2" stroke-dasharray="3 4"/>`+`<circle cx="250" cy="150" r="17" fill="#c0432f" opacity=".18"/><circle cx="250" cy="150" r="7" fill="#c0432f" stroke="#fff" stroke-width="2.5"/>`;
  } else if(kind==='mini'){
    route=`<path d="M40 ${h-24} C 80 60, 200 ${h-30}, 300 40" stroke="#c4543a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    pins = pin(40,h-24,1)+pin(300,40,2);
  }
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" preserveAspectRatio="xMidYMid slice" style="display:block">
    <rect x="0" y="0" width="${W}" height="${h}" fill="#f3f0e8"/>${blocks}${streets}${water}${route}${pins}${user}</svg>`;
}

function wave(active=10,total=30){
  let s='';
  const heights=[40,65,50,80,60,95,55,70,45,85,60,100,70,50,90,65,75,55,95,60,80,50,70,90,55,75,60,85,45,65];
  for(let i=0;i<total;i++){ s+=`<i class="${i<active?'on':''}" style="height:${heights[i%heights.length]}%"></i>`; }
  return `<div class="wave">${s}</div>`;
}

function tourCard({thumb,label,title,metaArr,status,actionHTML,menu}){
  return `<div class="tcard">
    <div class="thumb ${thumb}"><div class="topline"><span class="thumb-label">${label}</span>${status?pill(status.t,status.c):''}</div></div>
    <div class="body">
      <div style="display:flex;align-items:flex-start;gap:8px"><div class="ttl" style="flex:1">${title}</div>${menu?`<span class="chev" style="margin-top:2px">${ICON.dots}</span>`:''}</div>
      <div class="meta">${metaArr.map(m=>`<span>${m}</span>`).join('')}</div>
      ${actionHTML?`<div class="act">${actionHTML}</div>`:''}
    </div></div>`;
}

function ring(color){
  return `<svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--line-soft)" stroke-width="6"/><circle cx="38" cy="38" r="32" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="62 200" transform="rotate(-90 38 38)"><animateTransform attributeName="transform" type="rotate" from="-90 38 38" to="270 38 38" dur="1.1s" repeatCount="indefinite"/></circle></svg>`;
}
function genScreen(title,sub,steps,color){
  const stepRow=s=>{
    const ic = s.state==='done'?`<span style="color:var(--ok)">${smc}</span>`
      : s.state==='active'?`<span style="width:12px;height:12px;border-radius:50%;background:${color};display:inline-block"></span>`
      : `<span style="width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block"></span>`;
    return `<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line-soft)"><span style="width:18px;display:flex;justify-content:center">${ic}</span><span style="font-size:13.5px;color:${s.state==='pending'?'var(--ink-mute)':'var(--ink-soft)'};${s.state==='active'?'font-weight:600;color:var(--ink)':''}">${s.label}</span></div>`;
  };
  return `${sb()}<div class="abar"><div class="ic">${ICON.close}</div><div class="spacer"></div></div>
    <div class="scroll"><div class="pad center" style="padding-top:42px">
      <div style="margin:0 auto 22px;width:76px;height:76px">${ring(color)}</div>
      <div class="h-fr" style="font-size:22px;font-weight:600">${title}</div>
      <p class="muted" style="font-size:13px;margin:8px 18px 24px;line-height:1.5">${sub}</p>
      <div class="rows" style="text-align:left;padding:4px 16px">${steps.map(stepRow).join('')}</div>
    </div></div>${homeInd()}`;
}
function stepbar(n){
  let bars='';for(let i=1;i<=4;i++)bars+=`<div style="flex:1;height:4px;border-radius:2px;background:${i<=n?'var(--ochre)':'var(--line-soft)'}"></div>`;
  return `<div style="padding:0 20px 13px"><div class="mono" style="font-size:9.5px;letter-spacing:.13em;color:var(--ochre);font-weight:600;margin-bottom:8px">STEP ${n} OF 4</div><div style="display:flex;gap:5px">${bars}</div></div>`;
}

/* ════════════ ENGINE ════════════ */
const PATH_LABEL = {happy:'Main flow',edge:'Edge case',fail:'Error state'};
let FLAT=[]; let cur=0; let view='walk'; let tab='journey';
JOURNEY.forEach((b,bi)=>b.screens.forEach((s,si)=>FLAT.push({bi,si})));

const cssvar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function setAccent(el,colorKey){
  const v = COLOR[colorKey];
  el.style.setProperty('--c', `var(${v})`);
  el.style.setProperty('--c-soft', `var(${v}-soft)`);
}

function renderSpine(){
  const sp=document.getElementById('spine'); sp.innerHTML='';
  JOURNEY.forEach((b,bi)=>{
    const chip=document.createElement('button');
    chip.className='spine-chip'+(bi===FLAT[cur].bi?' on':'');
    chip.style.setProperty('--c',`var(${COLOR[b.color]})`);
    chip.style.setProperty('--c-soft',`var(${COLOR[b.color]}-soft)`);
    chip.innerHTML=`<span class="num">${b.num}</span><span class="nm">${b.name}</span>`;
    chip.onclick=()=>{ const idx=FLAT.findIndex(f=>f.bi===bi); go(idx); };
    sp.appendChild(chip);
    if(bi<JOURNEY.length-1){ const a=document.createElement('span'); a.className='spine-arrow'; a.textContent='→'; sp.appendChild(a); }
  });
  const on=sp.querySelector('.spine-chip.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}

function renderSubnav(){
  const b=JOURNEY[FLAT[cur].bi]; const nv=document.getElementById('subnav'); nv.innerHTML='';
  const lab=document.createElement('span'); lab.className='subnav-label'; lab.textContent=b.num+' · '+b.name; nv.appendChild(lab);
  b.screens.forEach((s,si)=>{
    const c=document.createElement('button');
    c.className='sc'+(si===FLAT[cur].si?' on':'');
    c.innerHTML=`<span class="dot ${s.path}"></span>${s.title}`;
    c.onclick=()=>{ const idx=FLAT.findIndex(f=>f.bi===FLAT[cur].bi&&f.si===si); go(idx); };
    nv.appendChild(c);
  });
}

function renderScreen(){
  const {bi,si}=FLAT[cur]; const b=JOURNEY[bi]; const s=b.screens[si];
  document.getElementById('screen').innerHTML=s.render();
}

function renderAnno(){
  const {bi,si}=FLAT[cur]; const b=JOURNEY[bi]; const s=b.screens[si];
  const anno=document.getElementById('anno');
  setAccent(anno,b.color);
  anno.classList.add('fading');
  setTimeout(()=>{
    let secs='';
    if(s.actions&&s.actions.length){ secs+=`<div class="anno-sec"><h4>Primary user actions</h4><ul>${s.actions.map(a=>`<li>${a}</li>`).join('')}</ul></div>`; }
    if(s.system&&s.system.length){ secs+=`<div class="anno-sec"><h4>System / logic</h4><ul>${s.system.map(a=>`<li>${a}</li>`).join('')}</ul></div>`; }
    const rec = s.recover?`<div class="recover"><div class="rl">Recovery / what happens next</div><p>${s.recover}</p></div>`:'';
    anno.innerHTML=`
      <div class="anno-head">
        <div class="anno-eye">
          <span class="pl">${b.num} · ${b.phase}</span>
          <span class="path-badge ${s.path}">${PATH_LABEL[s.path]}</span>${s.release?`<span style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:600;background:${s.release==='fastfollow'?'var(--slate-soft)':'var(--ok-soft)'};color:${s.release==='fastfollow'?'var(--slate)':'var(--ok)'}">${s.release==='fastfollow'?'Fast-follow':'MVP'}</span>`:''}
          <span class="sn">Screen ${cur+1}/${FLAT.length}</span>

}

function renderControls(){
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===FLAT.length-1;
  document.getElementById('stagecount').textContent=`${cur+1} / ${FLAT.length}`;
  document.getElementById('counter').innerHTML=`<b>${cur+1}</b> / ${FLAT.length} screens`;
  document.getElementById('foot-meta').textContent=`${JOURNEY.length} blocks · ${FLAT.length} screens`;
}

function renderAll(){ renderSpine(); renderSubnav(); renderScreen(); renderAnno(); renderControls(); }
function go(i){ cur=Math.max(0,Math.min(FLAT.length-1,i)); renderAll(); }
function step(d){ go(cur+d); }

function setView(v){
  view=v;
  document.getElementById('vt-walk').classList.toggle('on',v==='walk');
  document.getElementById('vt-grid').classList.toggle('on',v==='grid');
  document.getElementById('walkview').style.display = v==='walk'?'':'none';
  document.getElementById('gridview').style.display = v==='grid'?'block':'none';
  if(v==='grid') renderGrid();
}

function renderGrid(){
  const g=document.getElementById('gridview'); g.innerHTML='';
  JOURNEY.forEach((b,bi)=>{
    const block=document.createElement('div'); block.className='grid-block';
    block.style.setProperty('--c',`var(${COLOR[b.color]})`);
    block.innerHTML=`<div class="grid-block-h"><span class="gn">${b.num}</span><span class="gt">${b.name}</span><span class="muted mono" style="font-size:10px">${b.phase}</span></div>`;
    const row=document.createElement('div'); row.className='grid-row';
    b.screens.forEach((s,si)=>{
      const cell=document.createElement('div'); cell.className='gcell';
      const idx=FLAT.findIndex(f=>f.bi===bi&&f.si===si);
      cell.onclick=()=>{ setView('walk'); go(idx); window.scrollTo({top:0,behavior:'smooth'}); };
      cell.innerHTML=`<div class="gthumb-box"><div class="gthumb"><div class="phone" style="box-shadow:none;margin:0"><div class="screen">${s.render()}</div></div></div></div>
        <div class="gcap"><span class="dot ${s.path}"></span>${s.title}</div>`;
      row.appendChild(cell);
    });
    block.appendChild(row); g.appendChild(block);
  });
}

document.addEventListener('keydown',e=>{
  if(tab!=='journey'||view!=='walk') return;
  if(e.key==='ArrowRight'){ step(1); } else if(e.key==='ArrowLeft'){ step(-1); }
});

renderAll();

function renderStrategy(){

      <p><b>Viable, but narrow — and the obvious version is already taken.</b> “AI-generated, theme-personalized walking tours, any city, on demand” is shipping today (Voyay, AI-Tourguide) and is being absorbed as a free feature by Google (Gemini-in-Maps). Personalization-by-theme is not a moat.</p>
      <p>Ondoway earns a real but modest place <b>only</b> by being excellent at the three things the giants and clones are not: <b>content quality + provenance</b>, <b>offline, phone-light, GPS-triggered audio</b>, and <b>Paris done so well it earns word of mouth</b> — plus a second revenue leg (B2B2C), because one-and-done tourists cap consumer LTV. Most plausibly a <b>content-pipeline company that also has a great app</b>, not an app alone.</p></div>

    <h2>The cautionary corpse: Detour</h2>
    <div class="box warnbox"><div class="bxl">Lesson</div><p>Andrew Mason's Detour (2014–18) did exactly this — premium GPS-triggered audio walking tours, Paris included. It died because <b>content production was too expensive</b> and <b>use was too episodic</b> to retain; sold to Bose for the content, shut down (the team's real win was Descript). Ondoway's AI-from-source-texts pipeline is the strategic answer to what killed Detour — <b>but only if a great beat is genuinely cheap and clears the “worth paying for” bar.</b> That is the whole ballgame.</p></div>

    <h2>Landscape</h2>
    <table class="strat-table"><thead><tr><th>Player</th><th>Content</th><th>Money</th><th>Takeaway</th></tr></thead><tbody>

      <tr><td><b>Voyay</b></td><td>AI, interest-personalized, has a Paris page</td><td>Freemium</td><td>Your elevator pitch, already on the App Store.</td></tr>
      <tr><td><b>AI-Tourguide</b></td><td>Live-LLM, any city, Q&A</td><td>Credits</td><td><b>Explicitly NOT offline</b> — validates your offline bet.</td></tr>
      <tr><td><b>Rick Steves</b></td><td>Pro, brand</td><td>Free</td><td>Free + excellent + Paris = brutal price anchor.</td></tr>
      <tr><td><b>GPSmyCity</b></td><td>UGC, 1,500 cities</td><td>$1.99/walk</td><td>“Wide & shallow & janky” trap.</td></tr>
      <tr><td><b>Google (Gemini-in-Maps)</b></td><td>AI, free, default, global</td><td>Free</td><td>The existential ceiling — but “basic” today. Live in that gap.</td></tr>
      <tr><td><b>GetYourGuide / Viator</b></td><td>Booking marketplaces</td><td>20–35% commission</td><td>Own demand; the real profit pool is booking, not audio.</td></tr>
    </tbody></table>
    <p class="muted" style="font-size:12px">Market reality: the paid audio-tour <i>app</i> TAM is small (~$175M) with category-worst retention (D30 ≈ 5%); tourists buy a city once — squeezed between free giants and a swarm of LLM-wrapper clones.</p>

    <h2>Where the moat actually is (not “AI”)</h2>
    <ul class="clean">
      <li><b>Content quality + provenance + verification pipeline</b> — your two-source / source-passage / no-fabrication guardrails are a quality-and-legal moat; the answer to “why not just use Gemini?”</li>
      <li><b>Offline, phone-light, GPS-triggered audio UX</b> — copy-resistant vs live-LLM chatbots; works in dead zones.</li>
      <li><b>Distribution at the decision moment (B2B2C)</b> — hotels, DMOs, airlines, cruise. The most underrated real moat, and the escape from travel's CAC trap.</li>
      <li><b>Paris depth / exclusive local supply</b> — one excellent city beats 1,000 shallow ones.</li>
      <li class="mid">Personalization/usage data, brand, UGC — weak at your scale; don't anchor the pitch here.</li>
      <li class="no"><b>“AI personalization” as a moat</b> — commodity; Google ships it free.</li>
    </ul>

    <h2>Monetization — lead à-la-carte, not subscription</h2>
    <ul class="clean">
      <li><b>Per-city à la carte</b> — Paris bundle $9.99–$19.99; single tours $5.99–$8.99. Matches VoiceMap's proven band; exploits evergreen revenue.</li>
      <li><b>A free signature teaser tour</b> as a CAC / SEO / word-of-mouth engine — not freemium-as-business.</li>
      <li class="mid"><b>Hold subscription until ≥4–5 cities</b> — a tourist won't buy an annual plan for a once-a-year city.</li>
      <li><b>B2B2C in parallel</b> — DMO/hotel white-label, airline/cruise revenue-share. Low-CAC + recurring.</li>
      <li class="mid"><b>Later:</b> commission on bookable experiences inside tours — the GetYourGuide profit pool.</li>
    </ul>
    <p class="muted" style="font-size:12px">Reconciles against NORTHSTAR's current subscription-first model — a pricing decision worth making explicitly.</p>

    <h2>Risks — and the one to de-risk first</h2>
    <ol class="risk">
      <li class="one"><b>CAC vs one-and-done, single-city LTV.</b> At ~$4.70 CPI and ~2.4% install→purchase, paid acquisition costs more than a Paris sale returns. <b>No feature or moat fixes broken unit economics.</b></li>
      <li><b>Platform encroachment</b> — Gemini-in-Maps is already a free, global, hands-free walking guide.</li>
      <li><b>Thin defensibility</b> if content is merely “LLM facts + a theme filter.”</li>
      <li><b>Source-text copyright</b> — generating from in-copyright guidebooks is live exposure; AI output may itself be uncopyrightable.</li>
      <li><b>Episodic retention</b> + multi-city cold-start cost.</li>
    </ol>
    <div class="box"><div class="bxl">De-risk #1 before scaling content or cities</div><p>Prove <b>one near-zero-CAC channel</b> — a B2B2C beachhead (a Paris hotel group, a DMO slot, an airline/cruise tie-in) and/or destination SEO — that delivers trip-intent users at single-digit CAC against a $10–20 Paris AOV. That's the move that took Autio's CAC from $38 → $10. If you can't show it, no amount of better AI saves the model.</p></div>

    <h2>What I'd do (ties to the Build Map)</h2>
    <ol class="recs">
      <li><b>Ship the live, offline, GPS-triggered Paris walk + completion/rating</b> — it's both the thesis test and the moat. (Top of the Build Map.)</li>
      <li><b>Make Paris a “wow”</b> — depth over city-count; the only way to earn word of mouth.</li>
      <li><b>Blind-test content quality</b> vs free Google / Voyay — if beats don't feel clearly better, fix that first.</li>
      <li><b>Run one B2B2C distribution experiment</b> while still Paris-only, to attack risk #1 early.</li>
      <li><b>Re-price to à-la-carte per-city</b> for launch; reserve subscription for when you have cities.</li>
      <li><b>Reframe the pitch</b> from “AI personalization” to “the best offline local-storyteller audio in {city}” + a licensable content pipeline.</li>
    </ol>
    <div class="src">Sources (directional; vendor/press figures): Detour/TechCrunch · Skift DIY-tours thesis · Voyay · AI-Tourguide · Google Talking Tours hands-on · Autio/Shark Tank · VoiceMap evergreen revenue · GetYourGuide €1B profitable · RevenueCat State of Subscription Apps 2026 · Business of Apps benchmarks · audio-tour-app TAM (ResearchAndMarkets) · travel retention (Sendbird).</div>
  </div>`;
}

function setTab(t){
  tab=t;

  document.getElementById('journeyview').style.display=t==='journey'?'':'none';

  if(t==='build') renderBuild();
  if(t==='strategy') renderStrategy();
  if(t==='plan') renderPlan();
}

const PLAN_KEY='ondoway_plan_v4';
let PTASKS=null;
function seedTasks(){const a=[];PLAN.forEach((w,wi)=>w.days.forEach(d=>a.push({id:'t'+a.length,wk:wi,date:d.d,owner:d.o,theme:d.th,text:d.t,out:d.out,status:'todo'})));return a;}
function loadTasks(){try{const raw=localStorage.getItem(PLAN_KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.tasks)&&o.tasks.length)return o.tasks;}}catch(e){}return seedTasks();}
function saveTasks(){try{localStorage.setItem(PLAN_KEY,JSON.stringify({v:2,tasks:PTASKS}));}catch(e){}}
function planIcon(st){return st==='done'?'<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 6" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>':st==='doing'?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#fff"/></svg>':'';}
function cycleStatus(id){const t=PTASKS.find(x=>x.id===id);if(!t)return;t.status=t.status==='todo'?'doing':t.status==='doing'?'done':'todo';saveTasks();renderPlan();}
function saveTaskText(id,el){const t=PTASKS.find(x=>x.id===id);if(t){t.text=el.innerText.trim();saveTasks();}}
function saveOut(id,el){const t=PTASKS.find(x=>x.id===id);if(t){t.out=el.innerText.trim();saveTasks();}}
function addTask(wk){PTASKS.push({id:'t'+Date.now(),wk:wk,date:'—',owner:'sairam',theme:'mobile',text:'New task',out:'',status:'todo'});saveTasks();renderPlan();}
function delTask(id){PTASKS=PTASKS.filter(x=>x.id!==id);saveTasks();renderPlan();}
function resetPlan(){if(confirm('Reset to the original plan? Your edits and progress will be lost.')){PTASKS=seedTasks();saveTasks();renderPlan();}}
function exportPlan(){const blob=new Blob([JSON.stringify({v:2,tasks:PTASKS},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='ondoway-plan.json';a.click();URL.revokeObjectURL(u);}
function importPlan(file){if(!file)return;const r=new FileReader();r.onload=e=>{try{const o=JSON.parse(e.target.result);if(o&&Array.isArray(o.tasks)){PTASKS=o.tasks;saveTasks();renderPlan();}else alert('Not a valid plan file.');}catch(err){alert('Could not read that file.');}};r.readAsText(file);}
function renderPlan(){
  if(!PTASKS)PTASKS=loadTasks();
  const done=PTASKS.filter(t=>t.status==='done').length,tot=PTASKS.length,pct=tot?Math.round(100*done/tot):0;
  let weeks='';
  PLAN.forEach((w,wi)=>{
    const wt=PTASKS.filter(t=>t.wk===wi),wd=wt.filter(t=>t.status==='done').length,wp=wt.length?Math.round(100*wd/wt.length):0;
    const cells=wt.map(t=>{const th=THEME[t.theme]||THEME.mobile,ow=OWNER[t.owner]||OWNER.sairam;
      return `<div class="day st-${t.status}"><button class="day-del" onclick="delTask('${t.id}')" title="delete">×</button>
        <div class="day-top"><button class="status-btn st-${t.status}" onclick="cycleStatus('${t.id}')" title="to-do → doing → done">${planIcon(t.status)}</button><span class="day-date">${t.date}</span><span class="owner-pill" style="color:${ow[1]};border-color:${ow[1]}">${ow[0]}</span><span class="day-theme" style="background:${th[1]}">${th[0]}</span></div>
        <div class="day-task" contenteditable="true" spellcheck="false" onblur="saveTaskText('${t.id}',this)">${escapeHtml(t.text)}</div>
        <div class="day-out"><span class="out-l">Output</span><span class="out-t" contenteditable="true" spellcheck="false" onblur="saveOut('${t.id}',this)">${escapeHtml(t.out||'')}</span></div></div>`;
    }).join('');
    weeks+=`<div class="plan-week"><div class="pw-h"><span class="pw-n">${w.n}</span><span class="pw-t">${w.t}</span><span class="pw-d">${w.d}</span><span class="pw-prog"><span style="width:${wp}%"></span></span><span class="pw-count">${wd}/${wt.length}</span></div><div class="day-grid">${cells}<div class="add-task" onclick="addTask(${wi})">+ Add task</div></div></div>`;
  });
  document.getElementById('planview').innerHTML=`<div class="plan-wrap">
    <div class="eyebrow">Plan · two-track editable tracker</div>
    <h2 class="build-title">Ship Ondoway to the App Store — submit by July 3</h2>
    <p class="build-sub"><b>Starts today (Mon Jun 8).</b> Week 1 is <b>Adam</b> on the tour algorithm (design <code>ondoway-tour-algorithm.html</code>); <b>Sairam</b> on the live walk. Each weekday pairs <b>one task per person</b> — scan to today’s date to check both tracks. Phase-2 integration lands week 3, before the validation walks; auth is a bounded block after the July-3 gate. Every card = the action + its Output.</p>
    <div class="plan-toolbar"><div class="prog-wrap"><div class="prog-bar"><span style="width:${pct}%"></span></div><span class="prog-txt">${done} / ${tot} done · ${pct}%</span></div><div class="plan-actions"><button onclick="exportPlan()">Export</button><label class="imp">Import<input type="file" accept="application/json" onchange="importPlan(this.files[0]);this.value=''" hidden></label><button onclick="resetPlan()">Reset</button></div></div>
    <div class="gate-box"><b>Definition of done — Fri Jul 3:</b> the app is <b>archived and submitted to App Store review</b>. On a clean build, end-to-end: login → pick the free Paris tour → download → GPS-triggered audio walk → completion + rating. Reviewer demo account provided; location + background-audio usage strings, privacy labels, Privacy Policy, and Sign-in-with-Apple all in place.</div>
    <div class="legend"><span class="lg-h">Tracks</span>${Object.values(OWNER).map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}<span style="display:inline-block;width:1px;height:13px;background:var(--line);margin:0 4px"></span><span class="lg-h">Work</span>${Object.values(THEME).map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>
    ${weeks}
  </div>`;
}
