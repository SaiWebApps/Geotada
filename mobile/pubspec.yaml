name: ondoway
description: "Ondoway — GPS-triggered audio walking tours"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  go_router: ^14.0.0
  provider: ^6.1.0
  google_sign_in: ^6.2.0
  flutter_secure_storage: ^9.2.0
  app_links: ^6.3.0
  speech_to_text: ^7.0.0
  geolocator: ^13.0.2
  sign_in_with_apple: ^6.1.0
  apple_maps_flutter: ^1.4.0
  just_audio: ^0.9.40
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
