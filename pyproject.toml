[project]
name = "ondoway-neo4j"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0,<6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "shapely>=2.0",
    "requests>=2.31",
    "datasketch>=1.6.4,<2.0",
    "rapidfuzz>=3.0,<4.0",
    "anthropic>=0.39,<1.0",
    "pyjwt[crypto]>=2.8",
    "google-auth>=2.29",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
    "openai>=1.40",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "playwright>=1.40",
]
aws = [
    "boto3>=1.34",
]
dev = [
    "ruff>=0.4",
]

# Pin the package index so resolution is identical on every machine, regardless
# of any machine-level uv config (e.g. a corporate ~/.config/uv/uv.toml default).
# Regular (default) is public PyPI; `make sync-apple` overrides this via
# UV_DEFAULT_INDEX when on a network that only allows the Apple mirror.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # Depends() in FastAPI defaults is the correct pattern
    "E402",    # conftest.py must load .env.test before imports
    "E741",    # `l` for Lens in Cypher queries is clear in context
]

[tool.ruff.lint.per-file-ignores]
"tests/test_workbench_ui.py" = ["E501"]  # Inline JS strings exceed 100 chars

[tool.pytest.ini_options]
testpaths = ["tests"]
# Selection for the hermetic `test-local` shard. The definitive `make test`
# executor runs every routed category below through its environment-specific target.
addopts = "--ignore=tests/test_workbench_ui.py -m 'not live and not golden and not grade and not invariants'"
markers = [
    "live: hits live external services with real credentials; routed by `make test` through `make test-live`.",
    "requires_resend: live test that requires MAGIC_LINK_PROVIDER=resend and RESEND_API_KEY.",
    "golden: compares live dev-graph tours with the human-curated targets; routed by `make test` through `make test-golden`.",
    "grade: scores live dev-graph golden tours against GRADE_BASELINE; routed by `make test` through `make tour-grade`.",
    "invariants: generates live dev-graph tours and checks customer-facing regression invariants; routed by `make test` through `make tour-invariants`.",
]
